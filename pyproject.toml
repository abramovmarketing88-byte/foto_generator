[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foto-generator-bot"
version = "0.1.0"
description = "Telegram SaaS bot for AI photo creatives"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4.1,<4",
  "SQLAlchemy[asyncio]>=2.0.25,<3",
  "asyncpg>=0.29.0",
  "alembic>=1.13.1",
  "redis>=5.0.1",
  "arq>=0.26.0",
  "httpx>=0.27.0",
  "pydantic>=2.6.1",
  "pydantic-settings>=2.2.1",
  "python-json-logger>=2.0.7",
  "boto3>=1.34.54",
  "python-multipart>=0.0.9",
  "apscheduler>=3.10.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.2",
  "pytest-asyncio>=0.23.5",
]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
